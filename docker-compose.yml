services:
  postgres:
    image: postgres:16-alpine
    container_name: mega-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mega_ai
    ports:
      - "5432:5432"
    volumes:
      - mega_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mega_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: mega-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mega_ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mega_ai_postgres_data:
  mega_ai_redis_data:
